name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Тесттер және APK жинау
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: APK файлын жүктеуге қою
        uses: actions/upload-artifact@v4
        with:
          name: Tapsyrmalar-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Тест есептері
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: APK мен скриншоттарды репозиторийге сақтау
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p release docs/screenshots
          cp app/build/outputs/apk/debug/app-debug.apk release/Tapsyrmalar.apk
          cp app/build/screenshots/*.png docs/screenshots/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add release docs/screenshots
          if git diff --cached --quiet; then
            echo "Өзгеріс жоқ"
          else
            git commit -m "CI: APK және скриншоттарды жаңарту [skip ci]"
            git push
          fi
